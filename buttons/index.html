
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Button Styling</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Libre+Baskerville:wght@700&family=Montserrat:wght@500;700&family=Pacifico&display=swap">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <h1>Button Styling - Juliet Quisenberry</h1>

        <!-- BOTANICAL GARDEN -->

        <div class="button_container">

            <a href="https://www.missouribotanicalgarden.org/"
               id="btn_garden"
               target="_blank">

                <span class="garden-flower">✿</span>

                <span class="garden-text">
                    Missouri<br>Botanical Garden
                </span>

                <span class="garden-flower">✿</span>

            </a>

        </div>


        <!-- MICHAEL KORS -->

        <div class="button_container">

            <a href="https://www.michaelkors.com/"
               id="btn_kors"
               target="_blank">

                <span>MICHAEL KORS</span>

            </a>

        </div>


        <!-- THE NEW YORKER -->

        <div class="button_container">

            <a href="https://www.newyorker.com/"
               id="btn_newyorker"
               target="_blank">

                <span class="ny-front">
                    THE NEW YORKER
                </span>

                <span class="ny-back">
                    SINCE 1925
                </span>

            </a>

        </div>


        <!-- INSTAGRAM -->

        <div class="button_container">

            <a href="https://www.instagram.com/"
               id="btn_instagram"
               target="_blank"
               aria-label="Instagram">

                <span class="insta-camera">
                    <span class="insta-lens"></span>
                </span>

            </a>

        </div>


        <!-- COKE -->

        <div class="button_container">

            <a href="https://www.coca-cola.com/us/en"
               id="btn_coke"
               target="_blank">

                <span class="coke-text">
                    Coca-Cola
                </span>

                <span class="bubble bubble1"></span>
                <span class="bubble bubble2"></span>
                <span class="bubble bubble3"></span>

            </a>

        </div>

    </main>

</body>
</html>
